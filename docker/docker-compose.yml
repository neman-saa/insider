version: "3.9"
services:

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: clickhouse_insider
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - docker_clickhouse_data:/var/lib/clickhouse
      - ./ch_config/config.xml:/etc/clickhouse-server/config.d/docker.xml
      - ./ch_config/users.xml:/etc/clickhouse-server/users.d/docker.xml
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 16G

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: "no"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana_conf/datasource:/etc/grafana/provisioning/datasources
      - ./grafana_conf/dashboard/default.yaml:/etc/grafana/provisioning/dashboards/default.yaml
      - ./grafana_conf/dashboard/http4s_example_server_dashboard.json:/etc/grafana/provisioning/dashboards/http4s_example_server_dashboard.json
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: "no"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

volumes:
  docker_clickhouse_data:
    external: true
  prometheus_data: { }
  grafana-storage: { }
